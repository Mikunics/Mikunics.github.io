<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyMania</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .game-container { width: 80%; height: 600px; margin: 0 auto; }
        iframe { width: 100%; height: 100%; border: none; }
        .game-button { margin: 10px; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Select a Game to Play</h1>
    <button class="game-button" onclick="loadGame('cateatfish/index.html')">Cat Eat Fish</button>
    <button class="game-button" onclick="loadGame('whichanimalfits/index.html')">Which Animal Fits</button>
    <button class="game-button" onclick="loadGame('ninjabalance/index.html')">Ninja Balance</button>
    
    <div class="game-container">
        <iframe id="gameFrame" src=""></iframe>
    </div>

    <script>
        function loadGame(gamePath) {
            document.getElementById('gameFrame').src = gamePath;
        }
    </script>
</body>
</html>
